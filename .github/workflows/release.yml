# gozMCL — Create Release (fork workflow, replaces upstream HMCL-dev pipeline)
#
# Usage:
#   1. Optionally add repo secrets:
#        MICROSOFT_AUTH_ID   Azure app (client) ID -> enables official Microsoft account login
#        CURSEFORGE_API_KEY  CurseForge API key    -> enables mod download via CurseForge
#   2. Actions -> "Create Release" -> Run workflow
#   3. Review the draft release at https://github.com/gozMCL/gozMCL/releases
#
# Version scheme: <versionRoot from config/project.properties>.<build_number>
# e.g. versionRoot=3.17, build_number=1 -> 3.17.1, tag goz-3.17.1

name: Create Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number, becomes version <versionRoot>.<build_number> (e.g. 1 -> 3.17.1)'
        required: true
        default: '1'
        type: string
      prerelease:
        description: 'Mark the release as pre-release'
        required: false
        default: true
        type: boolean
      draft:
        description: 'Create the release as a draft'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'liberica'
          java-version: '17'
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Build (jar + exe + sh + deb)
        run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          BUILD_NUMBER: ${{ inputs.build_number }}
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Resolve built version
        id: version
        run: |
          JAR=$(ls HMCL/build/libs/HMCL-*.jar | grep -v '\.sha256$' | head -n 1)
          V=$(basename "$JAR" | sed 's/^HMCL-//; s/\.jar$//')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building gozMCL version $V (jar: $JAR)"

      - name: Check tag availability
        run: |
          TAG="goz-${{ steps.version.outputs.version }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Re-run with a different build_number."
            exit 1
          fi

      - name: Generate release notes
        run: |
          V="${{ steps.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/goz-$V"
          {
            echo "gozMCL $V (commit ${GITHUB_SHA::7})"
            echo ""
            echo "Fork of HMCL: game download for mainland China unblocked, official Microsoft account login support."
            echo ""
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            for ext in jar exe sh deb; do
              F="HMCL/build/libs/HMCL-$V.$ext"
              if [ -f "$F" ]; then
                echo "| [$V.$ext]($BASE/HMCL-$V.$ext) | \`$(sha256sum "$F" | cut -d' ' -f1)\` |"
              fi
            done
            echo ""
            echo "Windows: .exe (self-contained launcher). Linux: .sh or .deb. All platforms: .jar (JDK 17+ with JavaFX)."
            echo ""
            echo "See [docs/OfficialLogin_zh_Hans.md](https://github.com/${{ github.repository }}/blob/goz-$V/docs/OfficialLogin_zh_Hans.md) for enabling official account login in builds."
          } > RELEASE_NOTE

      - name: Create GitHub release
        run: |
          V="${{ steps.version.outputs.version }}"
          FILES=()
          for ext in jar exe sh deb; do
            F="HMCL/build/libs/HMCL-$V.$ext"
            [ -f "$F" ] && FILES+=("$F")
          done
          ARGS=(
            "goz-$V"
            "${FILES[@]}"
            --target "${GITHUB_SHA}"
            --title "gozMCL $V"
            --notes-file RELEASE_NOTE
          )
          if [ "${{ inputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi
          if [ "${{ inputs.draft }}" = "true" ]; then ARGS+=(--draft); fi
          gh release create "${ARGS[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
